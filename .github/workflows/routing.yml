name: Fase 2 — OSRM en Docker (matriz OD)

# La corrida oficial del motor de ruteo se ejecuta aquí y no en una laptop.
# Motivo documentado: OSRM se distribuye como contenedor y Docker Desktop en
# Windows exige WSL2 y permisos de administrador. El runner de Ubuntu ya trae
# Docker, 16 GB de RAM y 4 núcleos, así que la corrida es reproducible por
# cualquiera que haga fork del repositorio sin instalar nada.
#
# Se dispara tocando .github/routing.trigger (para no reconstruir el grafo en
# cada commit de código) o a mano desde la pestaña Actions.
#
# Cada paso vuelca su diagnóstico al resumen del job ($GITHUB_STEP_SUMMARY),
# que es público: quien no tenga permisos para leer los logs igual puede ver
# qué pasó.

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Alcance del análisis"
        type: choice
        options: [national, regions, dev]
        default: national
  push:
    paths:
      - ".github/routing.trigger"

concurrency:
  group: routing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  routing:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
    env:
      HW02_SCOPE: ${{ inputs.scope || 'national' }}
      OSRM_IMAGE: ghcr.io/project-osrm/osrm-backend:latest
      PRIMARY_PROFILE: car

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Entorno
        run: |
          {
            echo "## Entorno"
            echo '```'
            python -VV
            python -c "import pandas, numpy, geopandas, scipy, pyogrio; \
              print('pandas', pandas.__version__); print('numpy', numpy.__version__); \
              print('geopandas', geopandas.__version__); print('scipy', scipy.__version__); \
              print('pyogrio', pyogrio.__version__)"
            echo "alcance: $HW02_SCOPE"
            df -h / | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Los logs de Actions requieren sesión iniciada, pero las *anotaciones* son
      # públicas. run_step vuelca la cola del error a una anotación para que el
      # fallo sea diagnosticable sin permisos sobre el repositorio.
      # Puerta de calidad antes de gastar 40 minutos construyendo el grafo.
      - name: Pruebas
        run: bash scripts/run_step.sh "Pruebas" python -m pytest tests/ -q

      - name: Fase 1a — descarga de fuentes tabulares y límites
        run: bash scripts/run_step.sh "Fase 1a" python -m src.acquisition

      - name: Fase 1b — validación y muestreo
        run: bash scripts/run_step.sh "Fase 1b" python -m src.validation

      - name: Fase 1c — descarga de la red vial (OSM PBF)
        run: bash scripts/run_step.sh "Fase 1c" python -m src.acquisition --only osm_pbf

      - name: Resumen de la Fase 1
        if: always()
        run: |
          {
            echo "## Fase 1"
            echo '```'
            ls -lh data/raw 2>/dev/null || echo "(sin data/raw)"
            echo "---"
            ls -lh data/processed 2>/dev/null || echo "(sin data/processed)"
            echo "---- tail logs ----"
            tail -n 25 logs/*.log 2>/dev/null || echo "(sin logs)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Perfil car (principal)
        run: bash scripts/run_step.sh "OSRM car" bash scripts/osrm_build_and_route.sh car

      - name: Perfil foot
        continue-on-error: true
        run: bash scripts/run_step.sh "OSRM foot" bash scripts/osrm_build_and_route.sh foot

      - name: Perfil bike
        continue-on-error: true
        run: bash scripts/run_step.sh "OSRM bike" bash scripts/osrm_build_and_route.sh bike

      - name: Análisis multimodal
        run: bash scripts/run_step.sh "Multimodal" python -m src.routing --stage combine

      - name: Fases 3 a 5 e innovación
        run: |
          bash scripts/run_step.sh "Fase 3 métricas"   python -m src.metrics
          bash scripts/run_step.sh "Innovación"        python -m src.models
          bash scripts/run_step.sh "Fase 5 exportación" python -m src.export

      # Se commitea aquí, ANTES de compilar el PDF. Todo lo caro ya está hecho: la
      # matriz OD son ~27 minutos de construcción de grafos. Si LaTeX falla, la
      # corrida siguiente puede iterar sobre el PDF con analysis.yml en cinco
      # minutos en vez de reconstruir los tres grafos otra vez.
      - name: Commit de datos, figuras y tablas
        if: ${{ !cancelled() }}
        run: |
          bash scripts/commit_outputs.sh \
            "ci: matriz OD, métricas y figuras (OSRM, alcance ${HW02_SCOPE})" \
            data/outputs data/processed data/raw/manifest.json logs \
            report/figures report/tables

      - name: Compilar el informe
        id: latex
        continue-on-error: true
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: report

      - name: Diagnóstico de LaTeX
        if: ${{ always() && steps.latex.outcome == 'failure' }}
        run: bash scripts/latex_diag.sh

      - name: Commit del informe compilado
        if: ${{ always() && steps.latex.outcome == 'success' }}
        run: |
          bash scripts/commit_outputs.sh \
            "ci: informe compilado (alcance ${HW02_SCOPE})" \
            report/main.pdf

      - name: Resumen de la Fase 2
        if: always()
        run: |
          {
            echo "## Fase 2"
            echo '```'
            python - <<'PY'
          import glob, os
          import pandas as pd
          scope = os.environ["HW02_SCOPE"]
          path = f"data/outputs/od_car_matrix_{scope}.parquet"
          if os.path.exists(path):
              m = pd.read_parquet(path).set_index("demand_id")
              t = m.min(axis=1)
              print(f"matriz {m.shape[0]}x{m.shape[1]}")
              print(f"mediana {t.median():.1f} min | p90 {t.quantile(.9):.1f} | max {t.max():.1f}")
          else:
              print(f"no se generó {path}")
          for f in sorted(glob.glob("data/outputs/*")):
              print(f"{os.path.getsize(f)/1e6:8.2f} MB  {f}")
          PY
            echo "---- tail logs ----"
            tail -n 20 logs/routing*.log 2>/dev/null || echo "(sin logs de ruteo)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrices-od-${{ env.HW02_SCOPE }}
          path: |
            data/outputs/
            data/processed/
            logs/
          retention-days: 30
          if-no-files-found: warn

      # Red de seguridad: si algún paso intermedio abortó antes de llegar a los
      # dos commits de arriba, aquí se rescata lo que haya llegado a generarse.
      - name: Rescate de artefactos sin commitear
        if: ${{ !cancelled() }}
        run: |
          bash scripts/commit_outputs.sh \
            "ci: rescate de artefactos (alcance ${HW02_SCOPE}, job ${{ job.status }})" \
            data/outputs data/processed logs report/figures report/tables

      # `continue-on-error` en el paso de LaTeX evita perder el ruteo, pero deja
      # el job en verde aunque no haya PDF. El PDF compilado es un entregable
      # obligatorio, así que se falla aquí, al final: los datos ya están
      # commiteados y el rojo señala lo único que quedó pendiente.
      - name: Exigir el informe compilado
        if: ${{ !cancelled() }}
        run: |
          if [ ! -f report/main.pdf ]; then
            echo "::error title=Informe::no se generó report/main.pdf; ver el diagnóstico de LaTeX"
            exit 1
          fi
          echo "report/main.pdf presente ($(du -h report/main.pdf | cut -f1))"
