# Levantar OSRM en local. Ver docker/README.md para la secuencia completa.
#
# La variable OSM_PBF_DIR apunta al directorio que contiene peru.osm.pbf y donde
# se escribirán los archivos .osrm del grafo. Debe existir antes de correr.

services:
  # --- preprocesamiento (uno por perfil; se ejecutan con `run --rm`) ---------
  extract-car:
    image: ghcr.io/project-osrm/osrm-backend:latest
    volumes: ["${OSM_PBF_DIR:?define OSM_PBF_DIR}:/data"]
    command: osrm-extract -p /opt/car.lua /data/peru.osm.pbf

  extract-foot:
    image: ghcr.io/project-osrm/osrm-backend:latest
    volumes: ["${OSM_PBF_DIR:?define OSM_PBF_DIR}:/data"]
    command: osrm-extract -p /opt/foot.lua /data/peru.osm.pbf

  extract-bike:
    image: ghcr.io/project-osrm/osrm-backend:latest
    volumes: ["${OSM_PBF_DIR:?define OSM_PBF_DIR}:/data"]
    command: osrm-extract -p /opt/bicycle.lua /data/peru.osm.pbf

  partition:
    image: ghcr.io/project-osrm/osrm-backend:latest
    volumes: ["${OSM_PBF_DIR:?define OSM_PBF_DIR}:/data"]
    command: osrm-partition /data/peru.osrm

  customize:
    image: ghcr.io/project-osrm/osrm-backend:latest
    volumes: ["${OSM_PBF_DIR:?define OSM_PBF_DIR}:/data"]
    command: osrm-customize /data/peru.osrm

  # --- servidores (los puertos coinciden con [routing.osrm].base_urls) ------
  routed-car:
    image: ghcr.io/project-osrm/osrm-backend:latest
    volumes: ["${OSM_PBF_DIR:?define OSM_PBF_DIR}:/data"]
    ports: ["5000:5000"]
    command: >
      osrm-routed --algorithm mld --max-table-size 10000 /data/peru.osrm
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:5000/nearest/v1/car/-77.0428,-12.0464 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  routed-foot:
    image: ghcr.io/project-osrm/osrm-backend:latest
    volumes: ["${OSM_PBF_DIR:?define OSM_PBF_DIR}:/data"]
    ports: ["5001:5000"]
    command: >
      osrm-routed --algorithm mld --max-table-size 10000 /data/peru.osrm

  routed-bike:
    image: ghcr.io/project-osrm/osrm-backend:latest
    volumes: ["${OSM_PBF_DIR:?define OSM_PBF_DIR}:/data"]
    ports: ["5002:5000"]
    command: >
      osrm-routed --algorithm mld --max-table-size 10000 /data/peru.osrm
